<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow - Task Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 11l3 3L22 4"/>
                        <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
                    </svg>
                </div>
                <span>FocusFlow</span>
            </div>
            
            <nav class="nav-menu">
                <button class="nav-item active" data-filter="all">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                    </svg>
                    <span>All Tasks</span>
                    <span class="badge" id="all-count">0</span>
                </button>
                <button class="nav-item" data-filter="today">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    <span>Today</span>
                    <span class="badge" id="today-count">0</span>
                </button>
                <button class="nav-item" data-filter="important">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                    <span>Important</span>
                    <span class="badge" id="important-count">0</span>
                </button>
                <button class="nav-item" data-filter="completed">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
                        <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                    <span>Completed</span>
                    <span class="badge" id="completed-count">0</span>
                </button>
            </nav>

            <div class="progress-section">
                <h3>Weekly Progress</h3>
                <div class="progress-ring">
                    <svg viewBox="0 0 100 100">
                        <circle class="progress-ring-bg" cx="50" cy="50" r="45"/>
                        <circle class="progress-ring-fill" cx="50" cy="50" r="45" id="progress-circle"/>
                    </svg>
                    <div class="progress-text">
                        <span id="progress-percent">0%</span>
                        <small>done</small>
                    </div>
                </div>
                <p class="progress-message" id="progress-message">Start your day!</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1 id="page-title">All Tasks</h1>
                    <p id="current-date"></p>
                </div>
                <div class="header-right">
                    <div class="stats">
                        <div class="stat">
                            <span class="stat-value" id="total-tasks">0</span>
                            <span class="stat-label">Total</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value" id="pending-tasks">0</span>
                            <span class="stat-label">Pending</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value" id="done-tasks">0</span>
                            <span class="stat-label">Done</span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Add Task Section -->
            <section class="add-task-section">
                <div class="add-task-container">
                    <input 
                        type="text" 
                        id="task-input" 
                        placeholder="What needs to be done?"
                        autocomplete="off"
                    >
                    <select id="priority-select">
                        <option value="low">Low Priority</option>
                        <option value="medium" selected>Medium Priority</option>
                        <option value="high">High Priority</option>
                    </select>
                    <button id="add-btn" class="btn-primary">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        Add Task
                    </button>
                </div>
            </section>

            <!-- Task List -->
            <section class="task-list-section">
                <div class="task-filters">
                    <button class="filter-btn active" data-sort="newest">Newest First</button>
                    <button class="filter-btn" data-sort="priority">Priority</button>
                    <button class="filter-btn" data-sort="alphabetical">A-Z</button>
                </div>
                
                <ul class="task-list" id="task-list">
                    <!-- Tasks will be rendered here -->
                </ul>
                
                <div class="empty-state" id="empty-state">
                    <div class="empty-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M9 11l3 3L22 4"/>
                            <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
                        </svg>
                    </div>
                    <h3>No tasks yet</h3>
                    <p>Add your first task and start being productive!</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="edit-modal">
        <div class="modal-content">
            <h2>Edit Task</h2>
            <input type="text" id="edit-input" placeholder="Task name">
            <select id="edit-priority">
                <option value="low">Low Priority</option>
                <option value="medium">Medium Priority</option>
                <option value="high">High Priority</option>
            </select>
            <div class="modal-actions">
                <button class="btn-secondary" id="cancel-edit">Cancel</button>
                <button class="btn-primary" id="save-edit">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
